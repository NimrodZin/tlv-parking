<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181F">
<title>חניוני אחוזות החוף — מצב עכשיו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --ink:#14181F; --ink-2:#5B6270; --paper:#FFFFFF; --line:#E6E8EC; --wash:#F3F5F8;
    --free:#1E9E5A; --few:#E39A00; --full:#D4343C; --closed:#8B909A; --nodata:#5D7FA8;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:Heebo,'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);background:#DCE4E9;overflow:hidden}
  html[lang=ar] body{font-family:'IBM Plex Sans Arabic',Heebo,system-ui,sans-serif}
  html[lang=ar] .bar h1,html[lang=ar] .detail h2,html[lang=ar] .price .v,html[lang=ar] .row .st,html[lang=ar] .badge{font-weight:700}
  #map{position:fixed;inset:0;z-index:0}
  .leaflet-container{font:inherit}
  .leaflet-tile-pane{filter:saturate(.55) contrast(.92) brightness(1.04)}

  .top{position:fixed;top:0;inset-inline:0;z-index:20;padding:10px 12px 0;pointer-events:none}
  .bar{pointer-events:auto;background:var(--paper);border-radius:14px;box-shadow:0 2px 12px rgba(20,24,31,.14);padding:10px 14px 8px}
  .hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .bar h1{margin:0;font-size:17px;font-weight:900;letter-spacing:-.01em;line-height:1.2}
  .langs{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
  .langs button{border:0;background:var(--paper);font:inherit;font-size:12px;font-weight:700;padding:4px 8px;cursor:pointer;color:var(--ink-2)}
  .langs button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .bar .meta{font-size:12px;color:var(--ink-2);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar .meta .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--free)}
  .bar .meta .dot.stale{background:var(--few)}
  .search{position:relative;margin-top:8px}
  .search input{width:100%;font:inherit;font-size:15px;padding:9px 36px 9px 34px;border:1.5px solid var(--line);border-radius:11px;background:var(--wash);color:var(--ink)}
  .search input:focus{outline:none;border-color:var(--ink);background:var(--paper)}
  .search svg{position:absolute;inset-inline-end:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-2);pointer-events:none}
  .search .x{position:absolute;inset-inline-start:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:20px;line-height:1;color:var(--ink-2);padding:4px 8px;cursor:pointer;display:none}
  .search.has .x{display:block}
  .chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;display:flex;gap:6px;align-items:center}
  .chip .n{color:var(--ink-2);font-weight:400}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip[aria-pressed="true"] .n{color:#C9CDD4}
  .chip .sw{width:9px;height:9px;border-radius:50%}
  .chip:focus-visible,.btn:focus-visible,.row:focus-visible,.locate:focus-visible,.langs button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .pin{width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);background:var(--nodata);transition:transform .15s}
  .pin.free{background:var(--free)} .pin.few{background:var(--few)} .pin.full{background:var(--full)}
  .pin.closed{background:var(--closed)} .pin.nodata{background:#fff;border-color:var(--nodata);border-width:4px;width:20px;height:20px}
  .pin.dim{opacity:.2}
  .leaflet-marker-icon.sel .pin{transform:scale(1.4)}
  .locate{position:fixed;inset-inline-start:12px;bottom:calc(72px + var(--safe-b));z-index:25;width:42px;height:42px;border-radius:50%;border:0;background:var(--paper);box-shadow:0 2px 8px rgba(0,0,0,.2);display:grid;place-items:center;cursor:pointer}
  .locate svg{width:20px;height:20px}

  .sheet{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--paper);border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(20,24,31,.16);
    max-height:min(66vh,560px);display:flex;flex-direction:column;transition:transform .25s ease;padding-bottom:var(--safe-b)}
  .sheet.min{transform:translateY(calc(100% - 58px - var(--safe-b)))}
  .grip{flex:0 0 auto;padding:8px 16px 6px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
  .grip::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;border-radius:2px;background:#D5D9E0;transform:translateX(-50%)}
  .grip .t{font-weight:700;font-size:15px;margin-top:6px}
  .grip .s{font-size:12px;color:var(--ink-2);margin-top:6px}
  .list{overflow-y:auto;flex:1 1 auto;padding:0 8px 8px}
  .row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 8px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:start;font:inherit;color:inherit}
  .row:first-child{border-top:0}
  .row .st{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:12px;line-height:1;text-align:center;padding:0 2px}
  .row .st.free{background:var(--free)} .row .st.few{background:var(--few)} .row .st.full{background:var(--full)}
  .row .st.closed{background:var(--closed)} .row .st.nodata{background:#EEF2F7;color:var(--nodata);border:2px solid var(--nodata)}
  .row .nm{font-weight:700;font-size:15px}
  .row .ad{font-size:12.5px;color:var(--ink-2);margin-top:1px}
  .row .ds{font-size:13px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:end}
  .row .ds b{display:block;color:var(--ink);font-weight:700}
  .empty{padding:24px;text-align:center;color:var(--ink-2)}

  .detail{padding:4px 16px 16px;overflow-y:auto}
  .detail .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .detail h2{margin:0;font-size:21px;font-weight:900;line-height:1.15}
  .detail .sub{color:var(--ink-2);font-size:13px;margin-top:2px}
  .detail .addr{color:var(--ink-2);font-size:14px;margin-top:2px}
  .badge{flex:0 0 auto;border-radius:10px;padding:6px 12px;color:#fff;font-weight:900;font-size:14px}
  .badge.free{background:var(--free)} .badge.few{background:var(--few)} .badge.full{background:var(--full)}
  .badge.closed{background:var(--closed)} .badge.nodata{background:#EEF2F7;color:var(--nodata)}
  .prices{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:14px}
  .price{background:var(--wash);border-radius:14px;padding:10px 12px 9px;min-width:0}
  .price .v{font-size:26px;font-weight:900;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .price .v small{font-size:14px;font-weight:700;margin-inline-end:2px}
  .price .l{font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.3}
  .price.gratis .v{color:var(--free)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink)}
  .tag.good{border-color:var(--free);color:var(--free)}
  .tag.warn{border-color:var(--few);color:#9A6A00}
  .acts{display:flex;gap:8px;margin:14px 0 4px}
  .btn{flex:1;text-align:center;text-decoration:none;color:var(--ink);border:1.5px solid var(--ink);border-radius:12px;padding:10px;font-weight:700;font-size:14px;background:var(--paper);font-family:inherit;cursor:pointer}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.ghost{flex:0 0 auto;border-color:var(--line);color:var(--ink-2);font-weight:500}
  details{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
  summary{cursor:pointer;font-size:14px;color:var(--ink-2);list-style:none;display:flex;justify-content:space-between}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+"} details[open] summary::after{content:"–"}
  .raw{font-size:13.5px;line-height:1.55;margin-top:6px;direction:rtl;text-align:right}
  .raw h3{margin:8px 0 2px;font-size:12.5px;color:var(--ink-2);font-weight:500}
  .raw p{margin:0}
  .foot{font-size:12px;color:var(--ink-2);margin-top:12px}

  .msg{position:fixed;inset:0;display:grid;place-items:center;z-index:40;padding:24px;background:rgba(220,228,233,.9);text-align:center}
  .msg .card{background:var(--paper);border-radius:16px;padding:20px 22px;max-width:360px;box-shadow:0 4px 18px rgba(0,0,0,.15)}
  .msg h2{margin:0 0 6px;font-size:18px}
  .msg p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.5}
  .msg a{color:var(--ink)}
  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){.sheet,.pin{transition:none}}
  @media (min-width:900px){
    .top{inset-inline-start:auto;width:420px}
    .sheet{inset-inline-start:auto;inset-inline-end:12px;bottom:12px;width:420px;border-radius:18px;max-height:min(60vh,600px)}
    .sheet.min{transform:translateY(calc(100% - 58px))}
  }
</style>
</head>
<body>
<div id="map" role="application"></div>

<div class="top">
  <div class="bar">
    <div class="hrow">
      <h1 id="title"></h1>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="he">עב</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ar">ع</button>
      </div>
    </div>
    <div class="meta"><span class="dot" id="live"></span><span id="updated"></span><span id="counts"></span></div>
    <div class="search" id="searchWrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" enterkeyhint="search">
      <button class="x" id="qx" type="button">×</button>
    </div>
    <div class="chips" id="chips" role="group"></div>
  </div>
</div>

<button class="locate" id="locate" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="#14181F" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="#14181F"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>

<div class="sheet min" id="sheet">
  <div class="grip" id="grip" role="button" tabindex="0">
    <div class="t" id="sheetTitle"></div>
    <div class="s" id="sheetSub"></div>
  </div>
  <div class="list" id="list"></div>
  <div class="detail hidden" id="detail"></div>
</div>

<div class="msg hidden" id="msg"><div class="card"><h2 id="msgT"></h2><p id="msgP"></p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>

// Lot names: Hebrew (as in feed, folded) → [English, Arabic]

let lang = 'he', curAttrib = '';
const T = () => I18N[lang];
function pickLang(){
  const u = new URLSearchParams(location.search).get('lang');
  const s = localStorage.getItem('lang');
  const n = (navigator.language||'').slice(0,2);
  const c = u || s || (['en','ar','he'].includes(n)?n:'he');
  return I18N[c] ? c : 'he';
}
function setLang(l){
  lang = l; localStorage.setItem('lang', l);
  const t = T();
  document.documentElement.lang = l; document.documentElement.dir = t.dir; document.title = t.docTitle;
  document.getElementById('title').textContent = t.title;
  document.getElementById('q').placeholder = t.search; document.getElementById('q').setAttribute('aria-label', t.search);
  document.getElementById('qx').setAttribute('aria-label', t.clear);
  document.getElementById('locate').setAttribute('aria-label', t.locate);
  document.getElementById('map').setAttribute('aria-label', t.map);
  document.getElementById('grip').setAttribute('aria-label', t.showList);
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===l));
  map.attributionControl.setPrefix(false);
  if(curAttrib) map.attributionControl.removeAttribution(curAttrib);
  curAttrib = t.attrib; map.attributionControl.addAttribution(curAttrib);
  if(!lots.length) { document.getElementById('updated').textContent = t.loading; document.getElementById('sheetSub').textContent = me ? '' : t.locating; }
  render();
}
document.querySelectorAll('.langs button').forEach(b=> b.onclick = ()=>setLang(b.dataset.lang));

// ---------- state / map ----------
let lots = [], markers = new Map(), filter = 'all', query = '', selected = null, me = null, lastBatch = 0, lastFetch = 0;
const FILTER_IDS = ['all','free','few','full','gratis','nodata'];
const map = L.map('map', {zoomControl:false}).setView([32.08, 34.78], 13);
const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:''}).addTo(map);
L.control.zoom({position:'bottomleft'}).addTo(map);

// ---------- data ----------
const lines = s => (s||'').split('‡').map(x=>x.trim()).filter(Boolean);
const num = (re, s) => { const m = s.match(re); return m ? Number(m[1]) : null; };
const fold = s => (s||'').replace(/[״"`'’]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
function parseTariff(l){
  const all = [l.tariffDay, l.tariffDayWin, l.tariffNight, l.tariffNightWin].flat().join(' ');
  const notes = l.notes.join(' ');
  return {
    firstHour: num(/לשעה ראשונה[^0-9]{0,25}(\d+)/, all), quarter: num(/¼ שעה נוספת[^0-9]{0,25}(\d+)/, all),
    perHour: num(/(\d+)\s*₪\s*לשעה/, all), oneTime: num(/חד[ -]?פעמית?[^0-9]{0,25}(\d+)/, all), maxDay: num(/מקסימום ליום[^0-9]{0,10}(\d+)/, all),
    residentPct: num(/(\d+)%\s*(?:מתעריף|הנחה)/, notes) ?? num(/הנחה של (\d+)%/, notes),
    residentPrice: num(/תו אזורי[^0-9]{0,6}(\d+(?:\.\d+)?)\s*₪/, all),
    free15: /15 דקות ללא תשלום/.test(all+notes), creditOnly: /אשראי/.test(notes+all), closedNote: /נסגר/.test(all+notes)
  };
}
function norm(p){
  const s = (p.status_chenyon||'').trim();
  const k = {'פנוי':'free','מעט':'few','מלא':'full','סגור':'closed','פעיל':'open'}[s] || 'unknown';
  const l = {
    id: p.oid_hof, nameHe: (p.shem_chenyon||'').trim().replace(/\s+/g,' '), addr: (p.ktovet||'').trim(),
    lat: p.lat, lon: p.lon, sk: k, k: k==='open'||k==='unknown' ? 'nodata' : k,
    gratis: /ללא תשלום/.test(p.taarif_yom||''),
    tariffDay: lines(p.taarif_yom), tariffDayWin: lines(p.chalon_taarif_yom), tariffNight: lines(p.taarif_layla), tariffNightWin: lines(p.chalon_zman_taarif_layla),
    notes: lines(p.hearot_taarif), spaces: p.mispar_mekomot_bchenyon||0, ts: p.tr_status_chenyon||0
  };
  const tr = NAMES[fold(l.nameHe)] || [l.nameHe, l.nameHe];
  l.names = {he:l.nameHe, en:tr[0], ar:tr[1]};
  l.t = parseTariff(l);
  l.hay = fold(l.nameHe+' '+tr[0]+' '+tr[1]+' '+l.addr);
  return l;
}
const nameOf = l => l.names[lang];
const statusOf = l => T().status[l.sk];

async function load(){
  try{
    const r = await fetch(SRC, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const gj = await r.json();
    lots = gj.features.map(f=>norm(f.properties)).filter(l=>l.lat&&l.lon);
    lastBatch = Math.max(...lots.map(l=>l.ts)); lastFetch = Date.now();
    hideMsg(); render();
  }catch(e){
    if(!lots.length) showMsg(T().errT, T().errP(SRC));
    else document.getElementById('updated').textContent = T().errRefresh;
  }
}

// ---------- render ----------
function render(){
  if(!lots.length) return;
  renderMeta(); renderChips(); renderMarkers(); renderList();
  if(selected){ const l = lots.find(x=>x.id===selected); if(l) renderDetail(l); }
}
const hhmm = t => new Date(t).toLocaleTimeString(T().locale,{hour:'2-digit',minute:'2-digit'});
function renderMeta(){
  const t = T(), u = document.getElementById('updated'), dot = document.getElementById('live');
  if(lastBatch){
    const age = Date.now()-lastBatch;
    u.textContent = t.updated(hhmm(lastBatch), hhmm(lastFetch));
    dot.classList.toggle('stale', age>STALE_MS); dot.title = age>STALE_MS ? t.staleHint : t.freshHint;
  }
  const c = {free:0,few:0,full:0}; lots.forEach(l=>{ if(c[l.k]!==undefined) c[l.k]++; });
  document.getElementById('counts').textContent = t.counts(c.free,c.few,c.full);
}
function renderChips(){
  const el = document.getElementById('chips'); el.innerHTML='';
  FILTER_IDS.forEach(id=>{
    const n = id==='all'?lots.length: id==='gratis'?lots.filter(l=>l.gratis).length : lots.filter(l=>l.k===id).length;
    const b = document.createElement('button');
    b.className='chip'; b.type='button'; b.setAttribute('aria-pressed', filter===id);
    const sw = ['free','few','full','nodata'].includes(id) ? `<span class="sw" style="background:var(--${id})"></span>` : '';
    b.innerHTML = sw + T().filters[id] + `<span class="n">${n}</span>`;
    b.onclick = ()=>{ filter=id; selected=null; closeDetail(); render(); };
    el.appendChild(b);
  });
}
function passes(l){
  if(query && !l.hay.includes(query)) return false;
  if(filter==='all') return true;
  if(filter==='gratis') return l.gratis;
  return l.k===filter;
}
const icon = (l, dim) => L.divIcon({className:'', html:`<div class="pin ${l.k}${dim?' dim':''}"></div>`, iconSize:[22,22], iconAnchor:[11,11]});
function renderMarkers(){
  const seen = new Set();
  lots.forEach(l=>{
    seen.add(l.id);
    const dim = !passes(l);
    let m = markers.get(l.id);
    if(!m){
      m = L.marker([l.lat,l.lon], {icon:icon(l,dim), keyboard:true, title:nameOf(l)});
      m.on('click', ()=>select(l.id, true));
      m.addTo(map); markers.set(l.id, m);
    } else m.setIcon(icon(l,dim));
    m.setZIndexOffset(selected===l.id?200: dim?0:100);
    const el = m.getElement(); if(el){ el.classList.toggle('sel', selected===l.id); el.title = nameOf(l); }
  });
  markers.forEach((m,id)=>{ if(!seen.has(id)){ map.removeLayer(m); markers.delete(id);} });
}
function dist(l){ if(!me) return null; const R=6371, dLat=(l.lat-me.lat)*Math.PI/180, dLon=(l.lon-me.lon)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(me.lat*Math.PI/180)*Math.cos(l.lat*Math.PI/180)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(a)); }
const fmtDist = km => km==null?'':km<1?Math.round(km*1000)+' '+T().m:km.toFixed(1)+' '+T().km;
const walk = km => km==null?'':T().walk(Math.max(1,Math.round(km/4.5*60)));
function renderList(){
  const t = T(), el = document.getElementById('list'); el.innerHTML='';
  let arr = lots.filter(passes);
  const rank = {free:0,few:1,nodata:2,full:3,closed:4};
  arr.sort((a,b)=> me ? dist(a)-dist(b) : (rank[a.k]-rank[b.k]) || nameOf(a).localeCompare(nameOf(b), t.locale));
  document.getElementById('sheetTitle').textContent = query ? t.results : me ? t.near : t.all;
  document.getElementById('sheetSub').textContent = t.lots(arr.length) + ' · ' + (me ? t.byDist : t.byStatus);
  arr.forEach(l=>{
    const b = document.createElement('button'); b.className='row'; b.type='button';
    const d = dist(l);
    b.innerHTML = `<div class="st ${l.k}">${statusOf(l)[1]}</div>
      <div><div class="nm">${nameOf(l)}</div><div class="ad">${l.addr}${l.gratis?' · '+t.gratisTag:''}</div></div>
      <div class="ds">${d!=null?`<b>${fmtDist(d)}</b>${walk(d)}`:''}</div>`;
    b.onclick = ()=>select(l.id, false);
    el.appendChild(b);
  });
  if(!arr.length) el.innerHTML = `<div class="empty">${query?t.notFound:t.noneMatch}</div>`;
  if(query && arr.length){
    map.fitBounds(L.latLngBounds(arr.map(l=>[l.lat,l.lon])).pad(.3), {maxZoom:15});
    document.getElementById('sheet').classList.remove('min');
  }
}
function select(id, fromMap){
  selected = id; const l = lots.find(x=>x.id===id);
  renderMarkers(); renderDetail(l);
  document.getElementById('sheet').classList.remove('min');
  if(!fromMap) map.flyTo([l.lat,l.lon], Math.max(map.getZoom(),15), {duration:.4}); else map.panTo([l.lat,l.lon]);
}
function priceTiles(l){
  const t = T(), p = l.t, tiles = [];
  const sh = '<small>₪</small>';
  if(l.gratis) tiles.push(`<div class="price gratis"><div class="v">${t.pFree}</div><div class="l">${t.pFreeL}</div></div>`);
  else if(p.closedNote && !p.firstHour && !p.oneTime) tiles.push(`<div class="price"><div class="v">—</div><div class="l">${t.pClosed}</div></div>`);
  else {
    if(p.firstHour) tiles.push(`<div class="price"><div class="v">${sh}${p.firstHour}</div><div class="l">${t.firstHour}${p.quarter?t.quarter(p.quarter):''}</div></div>`);
    else if(p.perHour) tiles.push(`<div class="price"><div class="v">${sh}${p.perHour}</div><div class="l">${t.perHour}${p.maxDay?t.maxDay(p.maxDay):''}</div></div>`);
    if(p.oneTime) tiles.push(`<div class="price"><div class="v">${sh}${p.oneTime}</div><div class="l">${p.firstHour||p.perHour?t.oneNight:t.oneDay}</div></div>`);
    if(p.residentPrice) tiles.push(`<div class="price gratis"><div class="v">${sh}${p.residentPrice}</div><div class="l">${t.resident}</div></div>`);
    else if(p.residentPct) tiles.push(`<div class="price gratis"><div class="v">${p.residentPct}%</div><div class="l">${t.residentPct}</div></div>`);
    if(!tiles.length) tiles.push(`<div class="price"><div class="v">?</div><div class="l">${t.seeRaw}</div></div>`);
  }
  return `<div class="prices">${tiles.slice(0,3).join('')}</div>`;
}
function renderDetail(l){
  const t = T(), d = document.getElementById('detail');
  document.getElementById('list').classList.add('hidden'); d.classList.remove('hidden');
  const waze = `https://waze.com/ul?ll=${l.lat},${l.lon}&navigate=yes`;
  const gmaps = `https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lon}`;
  const p = l.t, tags = [];
  if(p.free15) tags.push(`<span class="tag good">${t.free15}</span>`);
  if(p.creditOnly) tags.push(`<span class="tag warn">${t.credit}</span>`);
  if(l.spaces) tags.push(`<span class="tag">${t.spaces(l.spaces)}</span>`);
  const dm = dist(l);
  const sec = (h,arr)=> arr.length?`<h3>${h}</h3>${arr.map(x=>`<p>${x}</p>`).join('')}`:'';
  d.innerHTML = `
    <div class="head"><div><h2>${nameOf(l)}</h2>${lang!=='he'?`<div class="sub" dir="rtl">${l.nameHe}</div>`:''}<div class="addr"><span dir="rtl">${l.addr}</span>${dm!=null?` · ${fmtDist(dm)}, ${walk(dm)}`:''}</div></div><div class="badge ${l.k}">${statusOf(l)[0]}</div></div>
    ${priceTiles(l)}
    ${tags.length?`<div class="tags">${tags.join('')}</div>`:''}
    <div class="acts">
      <a class="btn primary" href="${waze}" target="_blank" rel="noopener">${t.waze}</a>
      <a class="btn" href="${gmaps}" target="_blank" rel="noopener">${t.gmaps}</a>
      <button class="btn ghost" type="button" id="share">${t.share}</button>
    </div>
    <details><summary>${t.raw}</summary><div class="raw">
      ${sec('תעריף יום', l.tariffDay.concat(l.tariffDayWin))}${sec('תעריף לילה', l.tariffNight.concat(l.tariffNightWin))}${sec('הערות', l.notes)}
    </div></details>
    <div class="foot">${l.ts?t.asOf(new Date(l.ts).toLocaleString(t.locale,{dateStyle:'short',timeStyle:'short'})):''}${t.disclaimer}</div>
    <div class="acts" style="margin-top:8px"><button class="btn ghost" type="button" id="back" style="flex:1">${t.back}</button></div>`;
  document.getElementById('back').onclick = ()=>{ selected=null; closeDetail(); renderMarkers(); };
  document.getElementById('share').onclick = async ()=>{
    const url = `${location.origin}${location.pathname}?lang=${lang}#${l.id}`;
    const text = `${t.lotWord} ${nameOf(l)} — ${statusOf(l)[0]}. ${l.addr}`;
    if(navigator.share){ try{ await navigator.share({title:nameOf(l), text, url}); }catch(e){} }
    else { await navigator.clipboard.writeText(text+' '+url); document.getElementById('share').textContent=t.copied; }
  };
  history.replaceState(null,'',`?lang=${lang}#${l.id}`);
}
function closeDetail(){ document.getElementById('detail').classList.add('hidden'); document.getElementById('list').classList.remove('hidden'); history.replaceState(null,'',`?lang=${lang}`); }

// ---------- search ----------
const q = document.getElementById('q'), qw = document.getElementById('searchWrap');
q.addEventListener('input', ()=>{ query = fold(q.value); qw.classList.toggle('has', !!query); selected=null; closeDetail(); render(); if(!query) map.setView([32.08,34.78],13); });
document.getElementById('qx').onclick = ()=>{ q.value=''; q.dispatchEvent(new Event('input')); q.focus(); };
q.addEventListener('keydown', e=>{ if(e.key==='Enter'){ q.blur(); const first = lots.filter(passes)[0]; if(first) select(first.id,false); } });

// ---------- sheet, location ----------
const sheet = document.getElementById('sheet'), grip = document.getElementById('grip');
grip.onclick = ()=> sheet.classList.toggle('min');
grip.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); grip.click(); } };
map.on('click', ()=> sheet.classList.add('min'));
let meMarker;
function locate(fly){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p=>{
    me = {lat:p.coords.latitude, lon:p.coords.longitude};
    if(!meMarker) meMarker = L.circleMarker([me.lat,me.lon],{radius:7,color:'#fff',weight:3,fillColor:'#2F6BFF',fillOpacity:1}).addTo(map);
    else meMarker.setLatLng([me.lat,me.lon]);
    if(fly) map.flyTo([me.lat,me.lon], 15, {duration:.5});
    if(lots.length) renderList();
  }, ()=>{ document.getElementById('sheetSub').textContent=T().noLoc; }, {timeout:8000, maximumAge:60000, enableHighAccuracy:true});
}
document.getElementById('locate').onclick = ()=>locate(true);
